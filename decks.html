<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decks – Ghost Mansion</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="page-wrapper">
  <div id="navbar"></div>
  <main>
    <div class="page-header">
      <div>
        <div class="page-title">Deck Library</div>
        <div class="page-subtitle">Browse and manage Yu-Gi-Oh decks</div>
      </div>
      <div id="addDeckArea" class="hidden">
        <a href="deck-new.html" class="btn btn-primary">+ New Deck</a>
      </div>
    </div>

    <!-- Search & filter -->
    <div class="filter-bar" style="margin-bottom:1.5rem">
      <div class="form-group wide">
        <label class="form-label">Search</label>
        <input class="form-input" id="searchInput" placeholder="Search by name or owner…">
      </div>
      <div id="mineToggleArea" class="hidden">
        <button class="btn btn-ghost" id="toggleMine">Show Only My Decks</button>
      </div>
      <button class="btn btn-ghost" id="resetBtn">Reset</button>
    </div>

    <div id="alert" class="alert alert-error"></div>

    <div id="loading" class="loading-center"><div class="spinner"></div></div>
    <div id="deckGrid" class="deck-list hidden"></div>
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">🃏</div>
      <h3>No decks found</h3>
      <p>Try a different search or create the first deck!</p>
    </div>
  </main>
  <div id="footer"></div>
</div>

<!-- Rename Modal -->
<div class="modal-backdrop" id="renameModal">
  <div class="modal">
    <button class="modal-close" id="closeRename">✕</button>
    <div class="modal-title">Rename Deck</div>
    <div class="form-group">
      <label class="form-label">Deck Name</label>
      <input class="form-input" id="renameInput" placeholder="New name…">
    </div>
    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button class="btn btn-primary" id="saveRename">Save</button>
      <button class="btn btn-ghost"   id="cancelRename">Cancel</button>
    </div>
    <div id="renameAlert" class="alert alert-error"></div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal">
    <div class="modal-title">Delete Deck</div>
    <p style="color:var(--text-dim);margin-bottom:1.5rem">Are you sure you want to delete this deck?</p>
    <div style="display:flex;gap:0.75rem">
      <button class="btn btn-danger" id="confirmDelete">Delete</button>
      <button class="btn btn-ghost"  id="cancelDelete">Cancel</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
renderNavbar();
renderFooter();

if (Auth.isLoggedIn()) {
  document.getElementById('addDeckArea').classList.remove('hidden');
  document.getElementById('mineToggleArea').classList.remove('hidden');
}

let allDecks = [], filtered = [], showMine = false;
let renameTarget = null, deleteTarget = null;

const searchInput = document.getElementById('searchInput');
const loading   = document.getElementById('loading');
const grid      = document.getElementById('deckGrid');
const emptyEl   = document.getElementById('emptyState');
const alertEl   = document.getElementById('alert');

searchInput.addEventListener('input', applyFilter);
document.getElementById('resetBtn').addEventListener('click', () => { searchInput.value=''; applyFilter(); });
document.getElementById('toggleMine')?.addEventListener('click', () => {
  showMine = !showMine;
  document.getElementById('toggleMine').textContent = showMine ? 'Show All Decks' : 'Show Only My Decks';
  applyFilter();
});

async function loadDecks() {
  try {
    allDecks = await apiFetch('/decks');
    applyFilter();
  } catch(e) {
    showAlert(alertEl, e.message || 'Failed to load decks.');
  } finally {
    loading.classList.add('hidden');
  }
}

function applyFilter() {
  const q   = searchInput.value.trim().toLowerCase();
  const uid = Auth.getUserId();
  filtered  = allDecks.filter(d => {
    if (showMine && uid && d.ownerId !== uid) return false;
    if (q) {
      const inName  = (d.name ?? '').toLowerCase().includes(q);
      const inOwner = (d.ownerUsername ?? '').toLowerCase().includes(q);
      return inName || inOwner;
    }
    return true;
  });
  renderDecks();
}

function renderDecks() {
  grid.classList.remove('hidden');
  if (!filtered.length) {
    grid.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');
  const uid = Auth.getUserId();
  grid.innerHTML = filtered.map(d => {
    const canManage = Auth.isAdmin() || (uid && d.ownerId === uid);
    const cardCount = (d.ygoprocards?.length ?? 0) + (d.localcards?.length ?? 0);
    return `
      <div class="deck-card" style="cursor:default">
        <a href="deck-editor.html?id=${d.id}" class="deck-card-name" style="font-family:'Cinzel',serif;font-size:0.95rem;color:var(--text);display:block;margin-bottom:0.35rem;text-decoration:none;">${escHtml(d.name ?? 'Unnamed Deck')}</a>
        <div class="deck-card-meta">
          ${d.ownerImage ? `<img src="${escHtml(d.ownerImage)}" alt="">` : ''}
          <span>by <a href="profile.html?id=${d.ownerId}">${escHtml(d.ownerUsername ?? 'Unknown')}</a></span>
          <span class="badge badge-dim">${cardCount} cards</span>
        </div>
        ${canManage ? `
          <div class="deck-card-actions">
            <button class="btn btn-ghost btn-sm" onclick="openRename(${d.id}, '${escHtml(d.name ?? '')}')">Rename</button>
            <button class="btn btn-danger btn-sm" onclick="openDelete(${d.id})">Delete</button>
          </div>` : ''}
      </div>`;
  }).join('');
}

// ─── Rename ───────────────────────────────────────────────────────────────────
function openRename(id, currentName) {
  renameTarget = id;
  document.getElementById('renameInput').value = currentName;
  hideAlert(document.getElementById('renameAlert'));
  document.getElementById('renameModal').classList.add('open');
}
document.getElementById('closeRename').addEventListener('click', () => document.getElementById('renameModal').classList.remove('open'));
document.getElementById('cancelRename').addEventListener('click',() => document.getElementById('renameModal').classList.remove('open'));

document.getElementById('saveRename').addEventListener('click', async () => {
  const name = document.getElementById('renameInput').value.trim();
  const renameAlertEl = document.getElementById('renameAlert');
  if (!name) { showAlert(renameAlertEl, 'Name cannot be empty.'); return; }

  const btn = document.getElementById('saveRename');
  setLoading(btn, true, 'Saving…');
  try {
    const deck = allDecks.find(d => d.id === renameTarget);
    await apiFetch(`/decks/${renameTarget}`, {
      method: 'PUT',
      body: JSON.stringify({ ...deck, name })
    });
    const idx = allDecks.findIndex(d => d.id === renameTarget);
    if (idx >= 0) allDecks[idx].name = name;
    document.getElementById('renameModal').classList.remove('open');
    applyFilter();
  } catch(err) {
    showAlert(renameAlertEl, err.message || 'Failed to rename.');
  } finally {
    setLoading(btn, false);
  }
});

// ─── Delete ───────────────────────────────────────────────────────────────────
function openDelete(id) {
  deleteTarget = id;
  document.getElementById('deleteModal').classList.add('open');
}
document.getElementById('cancelDelete').addEventListener('click', () => document.getElementById('deleteModal').classList.remove('open'));
document.getElementById('confirmDelete').addEventListener('click', async () => {
  const btn = document.getElementById('confirmDelete');
  setLoading(btn, true, 'Deleting…');
  try {
    await apiFetch(`/decks/${deleteTarget}`, { method: 'DELETE' });
    allDecks = allDecks.filter(d => d.id !== deleteTarget);
    document.getElementById('deleteModal').classList.remove('open');
    applyFilter();
  } catch(err) {
    showAlert(alertEl, err.message || 'Failed to delete deck.');
    document.getElementById('deleteModal').classList.remove('open');
  } finally {
    setLoading(btn, false);
  }
});

loadDecks();
</script>
</body>
</html>
