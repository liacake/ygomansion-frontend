<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Deck – Ghost Mansion</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="page-wrapper">
  <div id="navbar"></div>
  <main>
    <div style="margin-bottom:1rem"><a href="decks.html" class="btn btn-ghost btn-sm">← Back to Decks</a></div>
    <div class="page-header">
      <div>
        <div class="page-title">New Deck</div>
        <div class="page-subtitle">Give your deck a name to get started</div>
      </div>
    </div>

    <div id="alert" class="alert alert-error"></div>

    <div class="panel" style="max-width:480px">
      <form id="newDeckForm" novalidate>
        <div class="form-group">
          <label class="form-label">Deck Name *</label>
          <input class="form-input" id="deckName" placeholder="e.g. Blue-Eyes Ultimate…" required autofocus>
          <div class="form-error" id="deckNameErr"></div>
        </div>
        <div style="display:flex;gap:0.75rem;margin-top:1rem">
          <button class="btn btn-primary" type="submit" id="submitBtn">Create &amp; Edit Deck</button>
          <a href="decks.html" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </main>
  <div id="footer"></div>
</div>
<script src="js/app.js"></script>
<script>
if (!requireAuth()) { /* handled */ }
renderNavbar();
renderFooter();

document.getElementById('newDeckForm').addEventListener('submit', async e => {
  e.preventDefault();
  const alertEl = document.getElementById('alert');
  hideAlert(alertEl);
  const name = document.getElementById('deckName').value.trim();
  const nameErr = document.getElementById('deckNameErr');

  if (!name) { nameErr.textContent = 'Deck name is required.'; return; }
  nameErr.textContent = '';

  const btn = document.getElementById('submitBtn');
  setLoading(btn, true, 'Creating…');
  try {
    const deck = await apiFetch('/decks', {
      method: 'POST',
      body: JSON.stringify({ name, ygoprocards: [], localcards: [] })
    });
    window.location.href = `deck-editor.html?id=${deck.id}`;
  } catch(err) {
    showAlert(alertEl, err.message || 'Failed to create deck.');
    setLoading(btn, false);
  }
});
</script>
</body>
</html>
