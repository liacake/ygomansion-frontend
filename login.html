<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Ghost Mansion</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">Ghost Mansion</div>
    <div class="auth-subtitle">Enter the Shadow Realm</div>

    <div id="alert" class="alert alert-error"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" id="username" name="username" type="text" placeholder="Your duelist name" autocomplete="username" required>
        <div class="form-error" id="usernameErr"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        <div class="form-error" id="passwordErr"></div>
      </div>
      <button class="btn btn-primary w-full" type="submit" id="submitBtn" style="width:100%;justify-content:center;margin-top:0.5rem">Login</button>
    </form>

    <div class="auth-switch">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = 'index.html';

  const form     = document.getElementById('loginForm');
  const alertEl  = document.getElementById('alert');
  const submitBtn = document.getElementById('submitBtn');

  function validate() {
    let ok = true;
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const uErr = document.getElementById('usernameErr');
    const pErr = document.getElementById('passwordErr');

    if (!u) { uErr.textContent = 'Username is required.'; ok = false; } else uErr.textContent = '';
    if (!p) { pErr.textContent = 'Password is required.'; ok = false; } else pErr.textContent = '';
    return ok;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    hideAlert(alertEl);
    if (!validate()) return;

    setLoading(submitBtn, true, 'Entering…');
    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      Auth.setSession(data.jwt);
      window.location.href = 'index.html';
    } catch(err) {
      showAlert(alertEl, err.message || 'Login failed. Check your credentials.');
    } finally {
      setLoading(submitBtn, false);
    }
  });
</script>
</body>
</html>
