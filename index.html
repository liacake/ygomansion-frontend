<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Mansion – Yu-Gi-Oh Card Manager</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="page-wrapper">
  <div id="navbar"></div>

  <main>
    <section class="hero">
      <div class="hero-title">Ghost Mansion</div>
      <div class="hero-sub">Yu-Gi-Oh Card Library &amp; Deck Builder</div>
      <div class="hero-actions">
        <a href="cards.html" class="btn btn-primary btn-lg">Browse Cards</a>
        <a href="decks.html" class="btn btn-secondary btn-lg">View Decks</a>
      </div>
    </section>

    
    <div class="recent-section">
      <div class="section-header">
        <span class="section-title">Recent Custom Cards</span>
      </div>
      <div id="recentCards" class="card-mini-grid">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>
</div>
<script src="js/app.js"></script>
<script>
  renderNavbar();
  renderFooter();

  async function loadRecent() {
    const el = document.getElementById('recentCards');
    try {
      const cards = await apiFetch('/cards');
      const recent = cards.slice(-8).reverse();
      if (!recent.length) {
        el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🂠</div><h3>No cards yet</h3><p>Be the first to create a custom card!</p></div>`;
        return;
      }
      el.innerHTML = recent.map(c => renderCardItem(c, `card-detail.html?id=${c.id}&type=local`)).join('');
    } catch(e) {
      el.innerHTML = `<div class="alert alert-error show">Could not load recent cards.</div>`;
    }
  }
  loadRecent();
</script>
</body>
</html>
